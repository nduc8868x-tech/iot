<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IoT Smart Home — API Documentation</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc;
    }

    /* ── Top banner ── */
    #top-banner {
      background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
      color: #fff;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,.25);
    }
    #top-banner .logo {
      font-size: 28px;
    }
    #top-banner .info h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .3px;
    }
    #top-banner .info p {
      font-size: 13px;
      opacity: .82;
      margin-top: 3px;
    }
    #top-banner .badge {
      margin-left: auto;
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 12px;
      font-weight: 600;
    }

    /* ── Swagger UI overrides ── */
    .swagger-ui .topbar { display: none; }

    .swagger-ui .info {
      margin: 24px 0 8px;
    }
    .swagger-ui .info .title {
      font-size: 26px !important;
      color: #1e3a5f !important;
    }

    /* Tag headers */
    .swagger-ui .opblock-tag {
      background: #f1f5ff !important;
      border-left: 4px solid #2563eb !important;
      border-radius: 6px !important;
      margin-bottom: 6px !important;
      color: #1e3a5f !important;
      font-size: 15px !important;
    }

    /* GET green */
    .swagger-ui .opblock.opblock-get {
      border-color: #16a34a !important;
      background: #f0fdf4 !important;
    }
    .swagger-ui .opblock.opblock-get .opblock-summary-method {
      background: #16a34a !important;
    }

    /* POST blue */
    .swagger-ui .opblock.opblock-post {
      border-color: #2563eb !important;
      background: #eff6ff !important;
    }
    .swagger-ui .opblock.opblock-post .opblock-summary-method {
      background: #2563eb !important;
    }

    /* response code badges */
    .swagger-ui .response-col_status { font-weight: 700; }

    /* container width */
    .swagger-ui .wrapper { max-width: 1100px; padding: 0 24px; }

    #swagger-ui { background: #f8fafc; padding-bottom: 60px; }
  </style>
</head>
<body>

<!-- Top banner -->
<div id="top-banner">
  <div class="logo">🏠</div>
  <div class="info">
    <h1>IoT Smart Home — API Docs</h1>
    <p>Nguyễn Mạnh Đức &nbsp;·&nbsp; B22DCPT061 &nbsp;·&nbsp; D22CQPT01 &nbsp;·&nbsp; nduc8868x@gmail.com</p>
  </div>
  <div class="badge">v1.1.0 &nbsp;·&nbsp; OpenAPI 3.0</div>
</div>

<div id="swagger-ui"></div>

<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js"></script>
<script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script>
const yamlSpec = `
openapi: 3.0.3
info:
  title: IoT Smart Home API
  description: |
    REST API cho hệ thống điều khiển và giám sát nhà thông minh.

    **Sinh viên**: Nguyễn Mạnh Đức (B22DCPT061) — D22CQPT01
    **GitHub**: https://github.com/nduc8868x-tech/iot
  version: 1.1.0
  contact:
    name: Nguyễn Mạnh Đức
    email: nduc8868x@gmail.com

servers:
  - url: http://localhost:3000/api
    description: Development server

tags:
  - name: Health
    description: Kiểm tra trạng thái server
  - name: Devices
    description: Quản lý và điều khiển thiết bị
  - name: Sensors
    description: Dữ liệu cảm biến môi trường
  - name: Activity
    description: Lịch sử hoạt động thiết bị

paths:

  /health:
    get:
      tags: [Health]
      summary: Kiểm tra trạng thái server
      description: Frontend gọi mỗi 30 giây để kiểm tra kết nối backend.
      responses:
        '200':
          description: Server hoạt động bình thường
          content:
            application/json:
              example:
                success: true
                data:
                  status: ok
                timestamp: '2026-05-04T02:00:00.000Z'

  /devices:
    get:
      tags: [Devices]
      summary: Lấy danh sách tất cả thiết bị
      responses:
        '200':
          description: Danh sách 3 thiết bị
          content:
            application/json:
              example:
                success: true
                data:
                  - id: '1'
                    name: Đèn chính
                    type: light
                    status: false
                    lastUpdated: '2026-05-04T02:00:00.000Z'
                  - id: '2'
                    name: Điều hòa
                    type: ac
                    status: true
                    lastUpdated: '2026-05-04T02:00:00.000Z'
                  - id: '3'
                    name: Quạt trần
                    type: fan
                    status: false
                    lastUpdated: '2026-05-04T02:00:00.000Z'
                timestamp: '2026-05-04T02:00:00.000Z'
        '500':
          description: Lỗi server

  /devices/{deviceId}/status:
    get:
      tags: [Devices]
      summary: Lấy trạng thái một thiết bị
      parameters:
        - name: deviceId
          in: path
          required: true
          description: "ID thiết bị: 1=Đèn chính, 2=Điều hòa, 3=Quạt trần"
          schema:
            type: string
            enum: ['1', '2', '3']
          example: '1'
      responses:
        '200':
          description: Trạng thái thiết bị
          content:
            application/json:
              example:
                success: true
                data:
                  id: '1'
                  status: true
                  timestamp: '2026-05-04T02:00:00.000Z'
                timestamp: '2026-05-04T02:00:00.000Z'
        '404':
          description: Thiết bị không tồn tại
          content:
            application/json:
              example:
                success: false
                error: Device not found
                timestamp: '2026-05-04T02:00:00.000Z'

  /devices/{deviceId}/control:
    post:
      tags: [Devices]
      summary: Bật / Tắt thiết bị
      description: |
        Gửi lệnh điều khiển. Backend sẽ:
        1. Cập nhật trạng thái in-memory
        2. Publish lệnh đến MQTT topic iot/device/{id}/control
        3. Ghi log vào MongoDB (collection DeviceAction)
      parameters:
        - name: deviceId
          in: path
          required: true
          description: "ID thiết bị: 1=Đèn chính, 2=Điều hòa, 3=Quạt trần"
          schema:
            type: string
            enum: ['1', '2', '3']
          example: '1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [ON, OFF]
                  description: Lệnh điều khiển
            examples:
              turnOn:
                summary: Bật thiết bị
                value:
                  action: ON
              turnOff:
                summary: Tắt thiết bị
                value:
                  action: OFF
      responses:
        '200':
          description: Điều khiển thành công
          content:
            application/json:
              example:
                success: true
                data:
                  success: true
                  deviceId: '1'
                  newStatus: true
                  message: Device 1 turned ON
                timestamp: '2026-05-04T02:00:00.000Z'
        '400':
          description: Action không hợp lệ
          content:
            application/json:
              example:
                success: false
                error: Invalid action. Must be ON or OFF
                timestamp: '2026-05-04T02:00:00.000Z'
        '404':
          description: Thiết bị không tồn tại
          content:
            application/json:
              example:
                success: false
                error: Device not found
                timestamp: '2026-05-04T02:00:00.000Z'

  /sensors/latest:
    get:
      tags: [Sensors]
      summary: Dữ liệu cảm biến mới nhất
      description: Trả về nhiệt độ, độ ẩm, ánh sáng cập nhật liên tục từ MQTT (ESP32).
      responses:
        '200':
          description: Dữ liệu cảm biến hiện tại
          content:
            application/json:
              example:
                success: true
                data:
                  temperature:
                    value: 27.5
                    unit: "°C"
                    timestamp: '2026-05-04T02:00:00.000Z'
                  humidity:
                    value: 65
                    unit: "%"
                    timestamp: '2026-05-04T02:00:00.000Z'
                  light:
                    value: 320.5
                    unit: Lux
                    timestamp: '2026-05-04T02:00:00.000Z'
                timestamp: '2026-05-04T02:00:00.000Z'

  /sensors/temperature:
    get:
      tags: [Sensors]
      summary: Nhiệt độ mới nhất
      responses:
        '200':
          description: Giá trị nhiệt độ
          content:
            application/json:
              example:
                success: true
                data:
                  value: 27.5
                  unit: "°C"
                  timestamp: '2026-05-04T02:00:00.000Z'
                timestamp: '2026-05-04T02:00:00.000Z'

  /sensors/humidity:
    get:
      tags: [Sensors]
      summary: Độ ẩm mới nhất
      responses:
        '200':
          description: Giá trị độ ẩm
          content:
            application/json:
              example:
                success: true
                data:
                  value: 65
                  unit: "%"
                  timestamp: '2026-05-04T02:00:00.000Z'
                timestamp: '2026-05-04T02:00:00.000Z'

  /sensors/light:
    get:
      tags: [Sensors]
      summary: Ánh sáng mới nhất
      responses:
        '200':
          description: Giá trị ánh sáng
          content:
            application/json:
              example:
                success: true
                data:
                  value: 320.5
                  unit: Lux
                  timestamp: '2026-05-04T02:00:00.000Z'
                timestamp: '2026-05-04T02:00:00.000Z'

  /sensors/history:
    get:
      tags: [Sensors]
      summary: Lịch sử cảm biến (phân trang)
      description: |
        Mỗi bản ghi chứa đồng thời nhiệt độ + độ ẩm + ánh sáng.
        Frontend flatten 1 bản ghi thành 3 dòng hiển thị.
      parameters:
        - name: page
          in: query
          description: Số trang (bắt đầu từ 1)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Số bản ghi mỗi trang (tối đa 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Lịch sử cảm biến có phân trang
          content:
            application/json:
              example:
                success: true
                data:
                  records:
                    - id: 1
                      deviceId: '#A3F2'
                      temperature: 27.9
                      humidity: 55
                      light: 117.22
                      timestamp: '02:00:00 04/05/2026'
                  total: 150
                  page: 1
                  limit: 10
                  totalPages: 15
                timestamp: '2026-05-04T02:00:00.000Z'

  /activity:
    get:
      tags: [Activity]
      summary: Lịch sử hoạt động thiết bị (phân trang)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
      responses:
        '200':
          description: Log hành động có phân trang
          content:
            application/json:
              example:
                success: true
                data:
                  records:
                    - id: 1
                      device: Đèn chính
                      deviceId: '#1'
                      action: BẬT
                      status: Thành công
                      timestamp: '02:00:00 04/05/2026'
                  total: 42
                  page: 1
                  limit: 10
                  totalPages: 5
                timestamp: '2026-05-04T02:00:00.000Z'

  /activity/stats:
    get:
      tags: [Activity]
      summary: Thống kê hành động theo ngày
      description: Số lần điều khiển mỗi thiết bị theo từng ngày, dùng để vẽ biểu đồ.
      responses:
        '200':
          description: Dữ liệu thống kê
          content:
            application/json:
              example:
                success: true
                data:
                  dates:
                    - date: 04/05/2026
                      Đèn chính: 5
                      Điều hòa: 3
                      Quạt trần: 2
                  devices:
                    - Đèn chính
                    - Điều hòa
                    - Quạt trần
                timestamp: '2026-05-04T02:00:00.000Z'
`;

  window.onload = function () {
    const spec = jsyaml.load(yamlSpec);
    SwaggerUIBundle({
      spec,
      dom_id: '#swagger-ui',
      deepLinking: true,
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
      plugins: [SwaggerUIBundle.plugins.DownloadUrl],
      layout: 'StandaloneLayout',
      defaultModelsExpandDepth: -1,
      defaultModelExpandDepth: 3,
      docExpansion: 'list',
      tryItOutEnabled: true,
    });
  };
</script>
</body>
</html>
